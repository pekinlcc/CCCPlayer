<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Glitched CCC — three stacked C glyphs with RGB chromatic-aberration shift,
       on a near-black panel with faint scanlines. Cyberpunk Winamp vibe. -->
  <defs>
    <!-- Rounded-square background (macOS style) -->
    <clipPath id="rounded">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <!-- Scanlines pattern -->
    <pattern id="scan" width="16" height="32" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="rgba(0,229,255,0.045)"/>
    </pattern>
    <!-- Subtle background vignette -->
    <radialGradient id="vignette" cx="50%" cy="42%" r="70%">
      <stop offset="0%"  stop-color="#0b0b18"/>
      <stop offset="55%" stop-color="#07070c"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>
    <!-- Per-channel glow filters -->
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#vignette)"/>
    <rect width="1024" height="1024" fill="url(#scan)"/>

    <!-- Glow halos behind the letters -->
    <g filter="url(#glow-soft)" opacity="0.55">
      <text x="512" y="688"
            text-anchor="middle"
            font-family="SF Mono, JetBrains Mono, Menlo, monospace"
            font-size="560" font-weight="900" letter-spacing="-48"
            fill="#ff2fd6">CCC</text>
    </g>

    <!-- Three stacked CCC with chromatic aberration -->
    <g font-family="SF Mono, JetBrains Mono, Menlo, monospace"
       font-size="560" font-weight="900" letter-spacing="-48"
       text-anchor="middle">
      <!-- magenta shifted left -->
      <text x="512" y="688" fill="#ff2fd6" opacity="0.9"
            transform="translate(-32,0)">CCC</text>
      <!-- cyan shifted right -->
      <text x="512" y="688" fill="#00e5ff" opacity="0.9"
            transform="translate(32,0)">CCC</text>
      <!-- lime on top, crisp -->
      <text x="512" y="688" fill="#baff29" filter="url(#glow-lime)">CCC</text>
    </g>

    <!-- Horizontal glitch strips across the middle -->
    <rect x="0" y="372" width="1024" height="22" fill="#00e5ff" opacity="0.55"/>
    <rect x="0" y="592" width="1024" height="14" fill="#ff2fd6" opacity="0.45"/>
    <!-- Short displaced slice to suggest broken scanline -->
    <rect x="140" y="470" width="360" height="6" fill="#baff29" opacity="0.7"/>
    <rect x="580" y="510" width="280" height="4" fill="#00e5ff" opacity="0.7"/>

    <!-- Border highlight (top-left bevel) -->
    <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"
          fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  </g>
</svg>
