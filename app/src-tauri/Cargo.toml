[package]
name = "cccplayer-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "cccplayer"
path = "src/main.rs"

[features]
# Default is "library" style so `cargo check` works without pulling Tauri
# native deps; `tauri` feature enables the full desktop binary.
default = []
tauri = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-notification",
    "dep:objc2",
    "dep:objc2-foundation",
]

[dependencies]
cccplayer-core = { path = "../../crates/core" }
cccplayer-harness = { path = "../../crates/harness" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-notification = { version = "2", optional = true }

# macOS-only: NSProcessInfo.beginActivity for App Nap suppression (§16.12).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }
objc2-foundation = { version = "0.2", features = ["NSProcessInfo", "NSString"], optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }
