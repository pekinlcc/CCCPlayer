name: Release (macOS)

# Triggered when a `v*` tag is pushed (e.g. `v1.7.5`). Builds the macOS
# arm64 bundle via scripts/build-macos.sh, ad-hoc signs it, packages an
# installer zip + tarball + dmg, and creates a GitHub Release with all
# three attached.
#
# Also supports manual dispatch (workflow_dispatch) so a botched run can
# be retried without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA). Default: HEAD of main.'
        required: false
        default: 'main'
      tag_name:
        description: 'Release tag to create / attach assets to (e.g. v1.7.5).'
        required: true

# Don't let two release builds for the same tag race each other if someone
# pushes a tag, deletes it, re-pushes it within minutes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build & release · macOS arm64
    runs-on: macos-14   # Apple Silicon runner (M1 family).
    permissions:
      contents: write   # required by softprops/action-gh-release to create the release & upload assets.

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # For workflow_dispatch, allow building an arbitrary ref. For
          # tag pushes, GH already checks out the tag.
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve tag name
        id: resolved
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain (with arm64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          # Distinguish from CI cache so concurrent runs don't fight.
          key: release-arm64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # cargo-tauri is a workspace dev tool. Pre-install it explicitly so
      # the build script's `cargo install` no-op fast-paths. `--locked`
      # uses the version's Cargo.lock for reproducibility.
      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build macOS arm64 release bundle
        # The script handles: rustup target add, npm ci (since we have a
        # lockfile), cargo tauri build, ad-hoc codesign, package zip + tar
        # + dmg into dist/.
        run: ./scripts/build-macos.sh --arch arm64

      - name: List artifacts
        run: |
          echo "::group::dist/"
          ls -la dist/
          echo "::endgroup::"

      # softprops/action-gh-release creates the release if it doesn't
      # exist and attaches the matched files. `generate_release_notes`
      # produces a default "What's changed" body from PR titles between
      # the previous tag and this one — we can edit it after.
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolved.outputs.tag }}
          name: ${{ steps.resolved.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/CCCPlayer-*-arm64-install.zip
            dist/CCCPlayer-*-arm64.dmg
            dist/CCCPlayer-*-arm64.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts as workflow output too
        # Belt + suspenders: even if the release step has trouble, the raw
        # bundles are downloadable from the Actions run UI for 90 days.
        uses: actions/upload-artifact@v4
        with:
          name: cccplayer-arm64-${{ steps.resolved.outputs.tag }}
          path: dist/CCCPlayer-*
          if-no-files-found: error
          retention-days: 90
