[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/harness",
    "crates/fake-cli",
    "app/src-tauri",
]

[workspace.package]
version = "1.7.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["CCCPlayer"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
tempfile = "3"
zstd = "0.13"
tar = "0.4"
walkdir = "2"
futures = "0.3"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
